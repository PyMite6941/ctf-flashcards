<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CTF Flashcards logo: a capture-the-flag flag over a terminal prompt -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#263450" stroke-width="2"/>
  <!-- flag pole -->
  <rect x="20" y="14" width="3.5" height="36" rx="1.75" fill="#8797b0"/>
  <!-- pennant flag -->
  <path d="M23.5 15 H45 L38 22 L45 29 H23.5 Z" fill="#38bdf8"/>
  <!-- terminal prompt ">_" -->
  <path d="M22 44 l6 5 l-6 5" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="32" y="52" width="12" height="3.5" rx="1.75" fill="#22c55e"/>
</svg>
